name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'
      - name: Setup Flutter project (if android missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android folder missing, creating temp flutter project..."
            flutter create --project-name kasir_sekolah --org com.sitinsantama /tmp/tmp_flutter
            cp -r /tmp/tmp_flutter/android ./android
            cp /tmp/tmp_flutter/analysis_options.yaml ./analysis_options.yaml 2>/dev/null || true
          fi
          flutter pub get
      - name: Build APK release
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-sekolah-apk
          path: build/app/outputs/flutter-apk/app-release.apk
